<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Pipeline — Internship Tracker</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #F5F4EF;
    color: #16233F;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    max-width: min(960px, 94vw);
    margin: 40px auto;
    padding: 0 16px;
  }
  h1 { font-size: 28px; margin-bottom: 4px; }
  .sub { color: #5B6472; font-size: 13px; margin-bottom: 24px; }
  .top-nav {
    position: sticky;
    top: 16px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 4px;
    width: fit-content;
    background: #FFFFFF;
    border: 1px solid #D8DADD;
    border-radius: 10px;
    padding: 5px;
    margin: 0 auto 28px;
    box-shadow: 0 2px 12px rgba(15,23,42,0.08);
  }
  .top-nav .brand {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 700;
    font-size: 14px;
    color: #8C6A28;
    padding: 8px 14px 8px 12px;
    margin-right: 4px;
    border-right: 1px solid #D8DADD;
    text-decoration: none;
    letter-spacing: 0.03em;
  }
  .top-nav a.nav-link {
    padding: 8px 16px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    color: #5B6472;
    text-decoration: none;
  }
  .top-nav a.nav-link.active {
    background: #B08D57;
    color: #16233F;
  }
  .top-nav a.nav-link.soon {
    color: #8A8F99;
  }
  .nav-dropdown { position: relative; display: flex; align-items: center; }
  .nav-caret {
    background: none;
    border: none;
    color: #8A8F99;
    cursor: pointer;
    font-size: 10px;
    padding: 8px 10px 8px 2px;
    margin-right: -6px;
  }
  .nav-dropdown-menu {
    display: none;
    position: absolute;
    top: 120%;
    left: 0;
    background: #FFFFFF;
    border: 1px solid #D8DADD;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(15,23,42,0.1);
    padding: 6px;
    min-width: 190px;
    z-index: 200;
  }
  .nav-dropdown-menu.open { display: block; }
  .nav-dropdown-menu a {
    display: block;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    color: #16233F;
    text-decoration: none;
  }
  .nav-dropdown-menu a:hover { background: #F6F6F3; }
  .nav-dropdown-menu a.active { color: #8C6A28; font-weight: 600; }
  .sub-nav {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .sub-nav a {
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 20px;
    text-decoration: none;
    color: #5B6472;
    background: #FFFFFF;
    border: 1px solid #D8DADD;
  }
  .sub-nav a.active {
    background: #B08D57;
    color: #16233F;
    border-color: #B08D57;
  }
  form {
    background: #FFFFFF;
    border: 1px solid #D8DADD;
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }
  .field-row {
    display: flex;
    gap: 10px;
  }
  .field-row > * { flex: 1; }
  input, select, textarea {
    background: #F6F6F3;
    border: 1px solid #D8DADD;
    border-radius: 6px;
    padding: 8px 10px;
    color: #16233F;
    font-size: 14px;
    font-family: inherit;
    width: 100%;
  }
  textarea { resize: vertical; min-height: 60px; }
  label.field-label {
    font-size: 11px;
    color: #5B6472;
    margin-bottom: 3px;
    display: block;
  }
  button {
    background: #B08D57;
    border: none;
    border-radius: 6px;
    padding: 10px;
    font-weight: 600;
    cursor: pointer;
  }

  /* --- filter bar --- */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
    align-items: center;
  }
  .filters select {
    width: auto;
    font-size: 12.5px;
    padding: 6px 8px;
  }
  .tab-group { display: flex; gap: 4px; }
  .tab {
    background: none;
    border: none;
    color: #5B6472;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: 400;
  }
  .tab.active { background: #EFEEE9; color: #16233F; }
  .status { font-size: 12px; color: #8A8F99; margin-left: auto; }

  /* --- rows --- */
  .row {
    background: #FFFFFF;
    border: 1px solid #E8E9EA;
    border-radius: 10px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .row-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 16px 10px;
    cursor: pointer;
  }
  .row .company { font-weight: 600; font-size: 15px; }
  .row .role { font-size: 12.5px; color: #5B6472; margin-top: 1px; }
  .tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 10.5px;
    color: #8C6A28;
    background: #F6EFDE;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .deadline { font-size: 12px; color: #5B6472; text-align: right; white-space: nowrap; }

  /* --- stage track --- */
  .stage-track { display: flex; align-items: center; padding: 0 16px 14px; }
  .stage-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #C7CBCF; background: transparent;
    cursor: pointer; padding: 0; flex-shrink: 0;
  }
  .stage-dot.done { background: #B08D57; border-color: #8C6A28; }
  .stage-line { flex: 1; height: 2px; background: #D8DADD; min-width: 6px; max-width: 26px; }
  .stage-line.done { background: #B08D57; }
  .stage-label { margin-left: 10px; font-size: 11px; color: #8C6A28; white-space: nowrap; }

  .row-expanded { border-top: 1px solid #E8E9EA; padding: 12px 16px 14px; }
  .row-expanded .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    font-size: 12.5px;
    margin-bottom: 12px;
  }
  .row-expanded .grid div span { color: #8A8F99; display: block; font-size: 10.5px; }
  .desc {
    font-size: 12.5px;
    color: #333B4D;
    line-height: 1.5;
    white-space: pre-wrap;
    margin-bottom: 12px;
    max-height: 120px;
    overflow-y: auto;
  }
  .row-actions { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .tailor-modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(22,35,63,0.5);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .tailor-modal-backdrop.open { display: flex; }
  .tailor-modal {
    background: #FFFFFF;
    border-radius: 14px;
    max-width: 640px;
    width: 100%;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(15,23,42,0.25);
  }
  .tailor-modal-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 20px 24px 14px;
    border-bottom: 1px solid #E8E9EA;
  }
  .tailor-modal-title { font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; }
  .tailor-modal-sub { font-size: 12px; color: #5B6472; margin-top: 3px; }
  .tailor-modal-close {
    background: none; border: none; color: #8A8F99;
    font-size: 20px; cursor: pointer; line-height: 1; padding: 4px;
  }
  .tailor-modal-body {
    padding: 20px 24px;
    overflow-y: auto;
    font-size: 13.5px;
    color: #16233F;
    line-height: 1.65;
  }
  .tailor-modal-body h2, .tailor-modal-body h3, .tailor-modal-body h4 {
    font-family: 'Source Serif 4', Georgia, serif;
    color: #16233F;
    margin: 18px 0 8px;
  }
  .tailor-modal-body h2:first-child, .tailor-modal-body h3:first-child { margin-top: 0; }
  .tailor-modal-body h2 { font-size: 16px; }
  .tailor-modal-body h3 { font-size: 14.5px; color: #8C6A28; }
  .tailor-modal-body h4 { font-size: 13.5px; }
  .tailor-modal-body p { margin: 0 0 10px; }
  .tailor-modal-body strong { color: #16233F; }
  .tailor-modal-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px;
    border-top: 1px solid #E8E9EA;
  }
  .tailor-modal-regen {
    background: none; border: 1px solid #D8DADD; color: #5B6472;
    font-size: 12px; font-weight: 600; padding: 7px 14px;
    border-radius: 6px; cursor: pointer;
  }
  .action-link {
    background: none; border: none; color: #5B6472;
    font-size: 12.5px; padding: 0; cursor: pointer;
  }
  .empty {
    padding: 48px 20px; text-align: center;
    border: 1px dashed #D8DADD; border-radius: 10px;
    color: #5B6472; font-size: 13px;
  }

  /* --- login gate --- */
  #login-gate {
    max-width: 360px;
    margin: 60px auto;
  }
  #login-gate h2 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 22px;
    margin-bottom: 4px;
    text-align: center;
  }
  #login-gate .sub { text-align: center; margin-bottom: 20px; }
  #login-error {
    color: #B14432;
    font-size: 12.5px;
    margin-top: -2px;
    display: none;
  }
  .logout-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }
  #logout-btn {
    background: none;
    border: 1px solid #D8DADD;
    color: #5B6472;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
</head>

<div class="sub">IB internship tracker — synced to your database</div>

<form id="add-form">
  <div class="field-row">
    <div>
      <label class="field-label">Firm</label>

    </div>
    <div>
      <label class="field-label">Role</label>

  <div>
    <label class="field-label">Sourced via contact (optional)</label>
    <select id="source_contact_id">
      <option value="">— None / found independently —</option>
    </select>
  </div>

  <div class="field-row">
    <div>
      <label class="field-label">Sector</label>
      <select id="sector">
        <option value="">— Select —</option>
        <option>Investment Banking (M&A/ECM/DCM)</option>
        <option>Sales & Trading</option>
        <option>Private Equity</option>
        <option>Asset & Investment Management</option>
        <option>Quantitative / Research</option>
        <option>Consulting</option>
        <option>Other</option>
      </select>
    </div>
    <div>
      <label class="field-label">Programme type</label>
      <select id="programme_type">
        <option value="">— Select —</option>
        <option>Insight Day / Spring Week</option>
        <option>Summer Internship</option>
        <option>Off-Cycle Internship</option>
        <option>Industrial Placement</option>
        <option>Graduate Scheme</option>
      </select>
    </div>
  </div>

  <div class="field-row">
    <div>
      <label class="field-label">Closing date</label>
      <input type="date" id="deadline">

    <div>
      <label class="field-label">Applied date</label>
      <input type="date" id="applied_date">

  <div>
    <label class="field-label">Application link</label>

      <label class="field-label">CV (PDF)</label>
      <input type="file" id="cv_file" accept="application/pdf,.pdf">

  <div class="tab-group" id="status-tabs">

    <button class="tab" data-filter="closed">Closed</button>
    <button class="tab" data-filter="all">All</button>
  </div>
  <select id="sector-filter">
    <option value="">All sectors</option>
  </select>
  <select id="programme-filter">
    <option value="">All programme types</option>
  </select>
  <span class="status" id="status-text">Loading...</span>
</div>

<div id="list"></div>

<input type="file" id="tailor-ref-cv-picker" accept="application/pdf,.pdf" style="display:none;">

      <button class="tailor-modal-close" id="tailor-modal-close" type="button">&times;</button>
    </div>

      <span class="tailor-modal-sub" id="tailor-modal-timestamp"></span>
      <button class="tailor-modal-regen" id="tailor-modal-regen" type="button">↻ Regenerate</button>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
  const SUPABASE_URL = "https://dnlrpybpbivtpnipkwpo.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRubHJweWJwYml2dHBuaXBrd3BvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MzgyODMsImV4cCI6MjEwMTQxNDI4M30.vVhwpSS5lMwTArRN-CHae5z3WMIbb5V-2mkUgHhiROw";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // One universal funnel for every programme type. Every stage dot is
  // independently clickable at any time (not gated in sequence), so an
  // application that skips straight from "Applied" to "Final Round" — like
  // a spring week with no OA — is handled by just clicking ahead, rather
  // than needing a separate shorter funnel per programme type. That keeps
  // it flexible enough for the fact that every insight day/spring week
  // process is genuinely a bit different, without hardcoding assumptions
  // about which stages apply.
  const STAGES = ["Researching", "Applied", "Online Tests", "Video Interview", "Assessment Centre", "Final Round", "Offer"];

  function getStages(app) {
    return STAGES;
  }

  const form = document.getElementById("add-form");
  const list = document.getElementById("list");
  const statusText = document.getElementById("status-text");
  const statusTabs = document.getElementById("status-tabs");
  const sectorFilter = document.getElementById("sector-filter");
  const programmeFilter = document.getElementById("programme-filter");

  let allApps = [];
  let allContacts = [];
  let currentTab = "active";
  let editingId = null; // tracks whether the form is adding a new entry or editing an existing one

  // Loads contacts from the outreach tracker so applications can be linked to
  // whichever contact led to them.
  async function loadContactsForDropdown() {
    const { data, error } = await sb
      .from("contacts")
      .select("id, name, firm")
      .order("name", { ascending: true });

    if (error) {
      console.error(error);
      return;
    }

    allContacts = data;
    const select = document.getElementById("source_contact_id");
    const current = select.value;
    select.innerHTML = '<option value="">— None / found independently —</option>' +
      data.map(c => `<option value="${c.id}">${c.name} (${c.firm})</option>`).join("");
    select.value = current;
  }

  // Looks up a contact's display name by id, for showing on application rows
  function contactLabel(id) {
    const c = allContacts.find(c => String(c.id) === String(id));
    return c ? `${c.name} (${c.firm})` : null;
  }

  async function loadApps() {
    statusText.textContent = "Loading...";
    const { data, error } = await sb
      .from("applications")
      .select("*")
      .order("deadline", { ascending: true });

    if (error) {
      statusText.textContent = "Error — check console (F12)";
      console.error(error);
      return;
    }

    allApps = data;
    populateFilterOptions(data);
    statusText.textContent = data.length + " total";
    renderList();
  }

  // Fills the sector/programme dropdowns with whatever values actually exist in the data
  function populateFilterOptions(apps) {
    const sectors = [...new Set(apps.map(a => a.sector).filter(Boolean))];
    const programmes = [...new Set(apps.map(a => a.programme_type).filter(Boolean))];

    const currentSector = sectorFilter.value;
    const currentProgramme = programmeFilter.value;

    sectorFilter.innerHTML = '<option value="">All sectors</option>' +
      sectors.map(s => `<option ${s === currentSector ? "selected" : ""}>${s}</option>`).join("");

    programmeFilter.innerHTML = '<option value="">All programme types</option>' +
      programmes.map(p => `<option ${p === currentProgramme ? "selected" : ""}>${p}</option>`).join("");
  }

  function renderList() {
    let filtered = allApps;

    if (currentTab === "active") filtered = filtered.filter(a => !a.closed);
    if (currentTab === "closed") filtered = filtered.filter(a => a.closed);

    if (sectorFilter.value) filtered = filtered.filter(a => a.sector === sectorFilter.value);
    if (programmeFilter.value) filtered = filtered.filter(a => a.programme_type === programmeFilter.value);

    list.innerHTML = "";

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">Nothing here yet — add an entry above or adjust your filters.</div>';
      return;
    }

    filtered.forEach(app => list.appendChild(buildRow(app)));
  }

  function buildRow(app) {
    const row = document.createElement("div");
    row.className = "row";

    const top = document.createElement("div");
    top.className = "row-top";

    const sourceLabel = app.source_contact_id ? contactLabel(app.source_contact_id) : null;
    const tagsHtml = [app.sector, app.programme_type]
      .filter(Boolean)
      .map(t => `<span class="tag">${t}</span>`)
      .join("") + (sourceLabel ? `<span class="tag" style="color:#1F7A4C;background:#E4F3EA;">via ${sourceLabel}</span>` : "");

    top.innerHTML = `
      <div>
        <div class="company">${app.company}</div>
        <div class="role">${app.role}</div>
        ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ""}
      </div>
      <div class="deadline">${app.deadline ? "Closes " + app.deadline : "No deadline"}</div>
    `;
    top.addEventListener("click", () => {
      const exp = row.querySelector(".row-expanded");
      exp.style.display = exp.style.display === "none" ? "block" : "none";
    });
    row.appendChild(top);

    if (!app.closed) {
      row.appendChild(buildStageTrack(app));
    }

    const expanded = document.createElement("div");
    expanded.className = "row-expanded";
    expanded.style.display = "none";
    expanded.innerHTML = `
      <div class="grid">
        <div><span>Applied date</span>${app.applied_date || "—"}</div>
        <div><span>Closing date</span>${app.deadline || "—"}</div>
        <div><span>Sourced via</span>${sourceLabel || "Found independently"}</div>
      </div>
      ${app.description ? `<div class="desc">${app.description}</div>` : ""}
      ${app.notes ? `<div class="desc" style="color:#5B6472">${app.notes}</div>` : ""}
      <div class="row-actions">
        ${app.link ? `<a class="action-link" href="${app.link}" target="_blank" rel="noopener">Open listing</a>` : ""}
        ${app.cv_url ? `<button type="button" class="action-link" data-view-doc="${app.cv_url}">View CV</button>` : ""}
        ${app.cover_letter_url ? `<button type="button" class="action-link" data-view-doc="${app.cover_letter_url}">View cover letter</button>` : ""}
        ${app.cv_tailoring_result
          ? `<button type="button" class="action-link" style="color:#8C6A28" data-show-tailor="${app.id}">View tailored CV advice</button>`
          : (app.description ? `<button type="button" class="action-link" style="color:#8C6A28" data-tailor-cv="${app.id}">Tailor CV ✨</button>` : "")}
        <button class="action-link" data-edit="${app.id}">Edit</button>
        ${!app.closed
          ? `<button class="action-link" style="color:#1F7A4C" data-offer="${app.id}">Mark offer</button>
             <button class="action-link" style="color:#B14432" data-reject="${app.id}">Mark rejected</button>`
          : `<button class="action-link" data-reopen="${app.id}">Reopen</button>`}
        <button class="action-link" style="color:#8A3A2E;margin-left:auto" data-delete="${app.id}">Delete</button>
      </div>
    `;
    row.appendChild(expanded);

    return row;
  }

  function buildStageTrack(app) {
    const stages = getStages(app);
    let currentIndex = stages.indexOf(app.stage);
    if (currentIndex === -1) currentIndex = 0;

    const track = document.createElement("div");
    track.className = "stage-track";

    stages.forEach((stageName, i) => {
      if (i > 0) {
        const line = document.createElement("div");
        line.className = "stage-line" + (i <= currentIndex ? " done" : "");
        track.appendChild(line);
      }
      const dot = document.createElement("button");
      dot.type = "button";
      dot.className = "stage-dot" + (i <= currentIndex ? " done" : "");
      dot.title = stageName;
      dot.addEventListener("click", (e) => {
        e.stopPropagation();
        updateField(app.id, { stage: stageName });
      });
      track.appendChild(dot);
    });

    const label = document.createElement("span");
    label.className = "stage-label";
    label.textContent = stages[currentIndex];
    track.appendChild(label);

    return track;
  }

  async function updateField(id, fields) {
    const { error } = await sb.from("applications").update(fields).eq("id", id);
    if (error) {
      alert("Couldn't update — check console (F12)");
      console.error(error);
      return;
    }
    loadApps();
  }

  // Makes sure a link always has "https://" in front, so the browser treats
  // it as a full web address instead of a path on our own site.
  function normalizeLink(value) {
    if (!value) return null;
    const trimmed = value.trim();
    if (!trimmed) return null;
    return /^https?:\/\//i.test(trimmed) ? trimmed : "https://" + trimmed;
  }

  // Turns "Goldman Sachs" into "goldman-sachs" for clean, readable storage paths
  function sanitizeForPath(str) {
    return (str || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }

  // Uploads a single PDF to the "documents" bucket and returns its storage
  // path (not a public URL — the bucket is private, so viewing later goes
  // through a freshly-generated signed link instead).
  async function uploadDocument(file, kind, company, role) {
    if (!file) return undefined; // no file chosen — caller leaves the field untouched
    const path = `${kind}/${Date.now()}-${sanitizeForPath(company)}-${sanitizeForPath(role)}.pdf`;
    const { error } = await sb.storage.from("documents").upload(path, file);
    if (error) {
      alert(`Couldn't upload ${kind === "cv" ? "CV" : "cover letter"} — check console (F12)`);
      console.error(error);
      return null;
    }
    return path;
  }

  // Fills the form with an existing entry's data and switches it into "edit" mode
  function startEdit(app) {
    editingId = app.id;
    document.getElementById("company").value = app.company || "";
    document.getElementById("role").value = app.role || "";
    document.getElementById("source_contact_id").value = app.source_contact_id || "";
    document.getElementById("sector").value = app.sector || "";
    document.getElementById("programme_type").value = app.programme_type || "";
    document.getElementById("deadline").value = app.deadline || "";
    document.getElementById("applied_date").value = app.applied_date || "";
    document.getElementById("link").value = app.link || "";
    document.getElementById("description").value = app.description || "";
    document.getElementById("notes").value = app.notes || "";

    document.getElementById("current-cv-status").innerHTML = app.cv_url
      ? `Current CV attached — <button type="button" class="action-link" style="display:inline;padding:0;text-decoration:underline;" data-view-doc="${app.cv_url}">view it</button> — choose a file to replace it`
      : "No CV uploaded yet";
    document.getElementById("current-cover-status").innerHTML = app.cover_letter_url
      ? `Current cover letter attached — <button type="button" class="action-link" style="display:inline;padding:0;text-decoration:underline;" data-view-doc="${app.cover_letter_url}">view it</button> — choose a file to replace it`
      : "No cover letter uploaded yet";

    document.getElementById("submit-btn").textContent = "Save changes";
    document.getElementById("cancel-edit-btn").style.display = "inline-block";
    form.scrollIntoView({ behavior: "smooth" });
  }

  // Resets the form back to "add new entry" mode
  function cancelEdit() {
    editingId = null;
    form.reset();
    document.getElementById("current-cv-status").textContent = "";
    document.getElementById("current-cover-status").textContent = "";
    document.getElementById("submit-btn").textContent = "Add to pipeline";
    document.getElementById("cancel-edit-btn").style.display = "none";
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const company = document.getElementById("company").value;
    const role = document.getElementById("role").value;
    const cvFile = document.getElementById("cv_file").files[0];
    const coverFile = document.getElementById("cover_letter_file").files[0];

    const submitBtn = document.getElementById("submit-btn");
    const originalBtnText = submitBtn.textContent;
    submitBtn.textContent = "Uploading...";
    submitBtn.disabled = true;

    // undefined = "no new file chosen, leave whatever's already saved untouched"
    const cv_url = await uploadDocument(cvFile, "cv", company, role);
    const cover_letter_url = await uploadDocument(coverFile, "cover-letter", company, role);

    submitBtn.disabled = false;
    submitBtn.textContent = originalBtnText;

    // A failed upload returns null specifically (not undefined) — stop rather
    // than save the application with a broken/missing document silently.
    if (cv_url === null || cover_letter_url === null) return;

    const payload = {
      company,
      role,
      source_contact_id: document.getElementById("source_contact_id").value || null,
      sector: document.getElementById("sector").value || null,
      programme_type: document.getElementById("programme_type").value || null,
      deadline: document.getElementById("deadline").value || null,
      applied_date: document.getElementById("applied_date").value || null,
      link: normalizeLink(document.getElementById("link").value),
      description: document.getElementById("description").value || null,
      notes: document.getElementById("notes").value || null,
    };
    if (cv_url !== undefined) payload.cv_url = cv_url;
    if (cover_letter_url !== undefined) payload.cover_letter_url = cover_letter_url;

    let error;
    if (editingId) {
      // Editing an existing entry — update it, keep its current stage untouched
      ({ error } = await sb.from("applications").update(payload).eq("id", editingId));
    } else {
      // Adding a brand new entry — starts at the first stage
      payload.stage = "Researching";
      ({ error } = await sb.from("applications").insert([payload]));
    }

    if (error) {
      alert("Couldn't save — check console (F12)");
      console.error(error);
      return;
    }

    cancelEdit();
    loadApps();
  });

  list.addEventListener("click", async function (e) {
    const t = e.target;
    if (t.dataset.delete) {
      const { error } = await sb.from("applications").delete().eq("id", t.dataset.delete);
      if (error) { console.error(error); return; }
      loadApps();
    }
    if (t.dataset.edit) {
      const app = allApps.find(a => String(a.id) === t.dataset.edit);
      if (app) startEdit(app);
    }
    if (t.dataset.offer) updateField(t.dataset.offer, { closed: "offer" });
    if (t.dataset.reject) updateField(t.dataset.reject, { closed: "rejected" });
    if (t.dataset.reopen) updateField(t.dataset.reopen, { closed: null });
  });

  document.getElementById("cancel-edit-btn").addEventListener("click", cancelEdit);

  statusTabs.addEventListener("click", (e) => {
    if (!e.target.dataset.filter) return;
    currentTab = e.target.dataset.filter;
    [...statusTabs.children].forEach(b => b.classList.toggle("active", b === e.target));
    renderList();
  });

  sectorFilter.addEventListener("change", renderList);
  programmeFilter.addEventListener("change", renderList);

  // --- Auth gate ---
  // onAuthStateChange fires once immediately with whatever session already
  // exists (or null), then again on every future sign-in/sign-out — so this
  // one listener handles the initial page load AND all later auth changes.
  sb.auth.onAuthStateChange((event, session) => {
    document.getElementById("login-gate").style.display = session ? "none" : "block";
    document.getElementById("app-content").style.display = session ? "block" : "none";
    if (session) {
      loadContactsForDropdown().then(loadApps);
    }
  });

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await sb.auth.signOut();
    window.location.href = "index.html";
  });

  // Opens a document via a fresh, temporary signed link rather than a
  // permanent public URL — generated on click since the bucket is private.
  document.addEventListener("click", async function (e) {
    const viewBtn = e.target.closest("[data-view-doc]");
    if (viewBtn) {
      const { data, error } = await sb.storage.from("documents").createSignedUrl(viewBtn.dataset.viewDoc, 3600);
      if (error) {
        alert("Couldn't open document — check console (F12)");
        console.error(error);
        return;
      }
      window.open(data.signedUrl, "_blank");
      return;
    }

    // Generating (or regenerating) — first ask for a reference CV to tailor
    // from, since it might not be the CV already attached to this application
    const tailorBtn = e.target.closest("[data-tailor-cv]");
    if (tailorBtn) {
      requestReferenceCV(tailorBtn.dataset.tailorCv, tailorBtn);
      return;
    }

    // Already have a saved result — just open it, no API call, no cost
    const showBtn = e.target.closest("[data-show-tailor]");
    if (showBtn) {
      const app = allApps.find(a => String(a.id) === showBtn.dataset.showTailor);
      if (app) openTailorModal(app);
      return;
    }
  });

  // Very lightweight markdown-to-HTML — just enough for the headers, bold
  // text, and paragraphs Claude's tailoring output actually uses.
  function renderMarkdown(text) {
    let html = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    html = html.replace(/^#### (.*)$/gm, "<h4>$1</h4>");
    html = html.replace(/^### (.*)$/gm, "<h3>$1</h3>");
    html = html.replace(/^## (.*)$/gm, "<h3>$1</h3>");
    html = html.replace(/^# (.*)$/gm, "<h2>$1</h2>");
    html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

    return html
      .split(/\n{2,}/)
      .map(block => (/^<h[2-4]>/.test(block.trim()) ? block : `<p>${block.replace(/\n/g, "<br>")}</p>`))
      .join("");
  }

  function formatTailorTimestamp(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return "Generated " + d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) +
      " at " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  }

  function openTailorModal(app) {
    document.getElementById("tailor-modal-title").textContent = "Tailored CV advice";
    document.getElementById("tailor-modal-sub").textContent = `${app.company} — ${app.role}`;
    document.getElementById("tailor-modal-body").innerHTML = renderMarkdown(app.cv_tailoring_result || "");
    document.getElementById("tailor-modal-timestamp").textContent = formatTailorTimestamp(app.cv_tailoring_generated_at);
    document.getElementById("tailor-modal-regen").dataset.appId = app.id;
    document.getElementById("tailor-modal-backdrop").classList.add("open");
  }

  function closeTailorModal() {
    document.getElementById("tailor-modal-backdrop").classList.remove("open");
  }

  // Extracts plain text from a PDF entirely in the browser using PDF.js —
  // sending Claude ready-made text instead of the raw PDF is both faster
  // and lighter, since Claude no longer has to visually process each page
  // like an image before it can read it.
  // Guarded so that if PDF.js somehow fails to load (CDN hiccup, etc.), it
  // only breaks the PDF-reading feature specifically — not every other
  // button and handler defined later in this same script block, which is
  // exactly what happened when this line crashed unguarded before.
  if (typeof pdfjsLib !== "undefined") {
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  } else {
    console.error("PDF.js failed to load — Tailor CV's file picker won't work until this is fixed.");
  }

  async function extractTextFromPDF(file) {
    if (typeof pdfjsLib === "undefined") {
      throw new Error("PDF.js didn't load — try refreshing the page");
    }
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const textContent = await page.getTextContent();
      fullText += textContent.items.map(item => item.str).join(" ") + "\n\n";
    }
    return fullText.trim();
  }

  // Opens the file picker to choose a reference CV — could be the CV
  // already attached to this application, or (just as often, per how this
  // actually gets used) a CV from a similar recent application being
  // adapted for this new one. Either way, the picked file is used purely
  // to generate advice and is never saved as this application's CV.
  const refCvPicker = document.getElementById("tailor-ref-cv-picker");
  let pendingTailorAppId = null;

  function requestReferenceCV(appId, triggerBtn) {
    pendingTailorAppId = appId;
    refCvPicker.dataset.triggerBtnId = triggerBtn ? triggerBtn.id || "" : "";
    refCvPicker.value = ""; // clear any previous selection so picking the same file again still fires "change"
    refCvPicker.click();
  }

  refCvPicker.addEventListener("change", async function () {
    const file = refCvPicker.files[0];
    if (!file || !pendingTailorAppId) return;

    let text;
    try {
      text = await extractTextFromPDF(file);
    } catch (extractErr) {
      alert("Couldn't read that PDF — it may be corrupted or an unusual format. Try a different file.");
      console.error(extractErr);
      return;
    }
    if (!text || text.length < 50) {
      alert("Couldn't find readable text in that PDF — it may be a scanned image rather than a text-based document. Try a different file.");
      return;
    }

    runTailorCV(pendingTailorAppId, text, file.name);
  });

  // Wraps a promise with a hard timeout, so "waiting forever with no idea
  // what's happening" is never possible — after 35s (longer than the
  // server's own 25s timeout, so the server's cleaner error message wins
  // most of the time) this fires instead.
  function withTimeout(promise, ms) {
    return Promise.race([
      promise,
      new Promise((_, reject) => setTimeout(() => reject(new Error("TIMEOUT")), ms)),
    ]);
  }

  // Keeps the last-used reference CV in memory so "Try again" after a
  // failure or timeout doesn't force picking the file all over again.
  let lastTailorAttempt = null;

  // Shared by both failure paths below — shows an error message plus a
  // "Try again" button that retries with the exact same reference CV.
  function showTailorError(message) {
    document.getElementById("tailor-modal-body").innerHTML = `
      <p style="color:#B14432;">${message}</p>
      <button type="button" class="tailor-modal-regen" id="tailor-retry-btn" style="width:auto;">Try again</button>`;
    document.getElementById("tailor-retry-btn").addEventListener("click", () => {
      runTailorCV(lastTailorAttempt.appId, lastTailorAttempt.cvText, lastTailorAttempt.filename);
    });
  }

  // One attempt at calling the Edge Function. Returns { ok, data, timedOut }
  // rather than throwing, so the caller can decide what to do next.
  async function attemptTailorCall(appId, cvText) {
    console.log(`[tailor-cv] Invoking function for application ${appId} at ${new Date().toISOString()}`);
    try {
      const { data, error } = await withTimeout(
        sb.functions.invoke("tailor-cv", { body: { applicationId: appId, cvText } }),
        55000
      );
      console.log(`[tailor-cv] Response received at ${new Date().toISOString()}`, { data, error });

      if (data?.error) {
        return { ok: false, timedOut: false, message: typeof data.error === "string" ? data.error : JSON.stringify(data.error) };
      }

      if (error) {
        // supabase-js doesn't automatically read the JSON body of a non-2xx
        // response — it just gives a generic "non-2xx status code" message
        // by default. The function's actual error text lives on
        // error.context, so read it directly to get the real reason.
        let message = error.message;
        if (error.context && typeof error.context.json === "function") {
          try {
            const body = await error.context.json();
            if (body?.error) message = typeof body.error === "string" ? body.error : JSON.stringify(body.error);
          } catch (parseErr) {
            // context wasn't valid JSON — fall back to the generic message
          }
        }
        return { ok: false, timedOut: false, message };
      }

      return { ok: true, data };
    } catch (timeoutErr) {
      console.error(`[tailor-cv] Exception in attemptTailorCall at ${new Date().toISOString()}:`, timeoutErr);
      return { ok: false, timedOut: true, message: "timed out" };
    }
  }

  // Checks whether the result actually landed in the database despite the
  // client giving up on it — the server has its own 45s window and can
  // legitimately still be working (or have just finished) even after our
  // 55s client-side patience runs out. This is specifically what happened
  // once already: the function succeeded and saved correctly, but the
  // client had already shown a timeout with nothing to show for it.
  // Checking here — instead of blindly firing a second paid API call —
  // avoids both the wasted cost and the confusing "it worked but you never
  // saw it" outcome.
  async function checkForLateResult(appId) {
    const { data, error } = await sb
      .from("applications")
      .select("cv_tailoring_result, cv_tailoring_generated_at")
      .eq("id", appId)
      .single();

    if (error || !data?.cv_tailoring_result || !data.cv_tailoring_generated_at) return null;

    // Only count it as "from this attempt" if it was generated very recently —
    // an old saved result from a previous session shouldn't be mistaken for
    // this one just finishing late.
    const ageSeconds = (Date.now() - new Date(data.cv_tailoring_generated_at).getTime()) / 1000;
    return ageSeconds < 120 ? data : null;
  }

  // Calls the Edge Function with the chosen reference CV, shows the modal
  // with a loading state, then fills it in once the result (which the
  // function has already saved to the database) comes back.
  async function runTailorCV(appId, cvText, filename) {
    lastTailorAttempt = { appId, cvText, filename };

    const app = allApps.find(a => String(a.id) === String(appId));
    document.getElementById("tailor-modal-title").textContent = "Tailored CV advice";
    document.getElementById("tailor-modal-sub").textContent = app ? `${app.company} — ${app.role}` : "";
    document.getElementById("tailor-modal-body").innerHTML =
      `<p style="color:#5B6472;">Reading ${filename || "your CV"} and comparing it against the job description — this can take up to a minute.</p>`;
    document.getElementById("tailor-modal-timestamp").textContent = "";
    document.getElementById("tailor-modal-backdrop").classList.add("open");

    const result = await attemptTailorCall(appId, cvText);

    if (!result.ok) {
      // Before showing any error or retrying (which costs money again),
      // check whether it actually succeeded on the server anyway.
      document.getElementById("tailor-modal-body").innerHTML =
        `<p style="color:#5B6472;">That took longer than expected — checking whether it finished anyway before trying again...</p>`;
      const late = await checkForLateResult(appId);

      if (late) {
        document.getElementById("tailor-modal-body").innerHTML = renderMarkdown(late.cv_tailoring_result);
        document.getElementById("tailor-modal-timestamp").textContent = formatTailorTimestamp(late.cv_tailoring_generated_at);
        document.getElementById("tailor-modal-regen").dataset.appId = appId;
        loadApps();
        return;
      }

      showTailorError(
        result.timedOut
          ? "This timed out and doesn't appear to have completed on the server either. Worth trying again."
          : `Couldn't generate this — ${result.message || "check console (F12)"}`
      );
      console.error(result.message);
      return;
    }

    const saveWarning = result.data.saveFailed
      ? '<p style="color:#B14432; font-size:12px; margin-bottom:12px;">⚠ This generated correctly but didn\'t save — it won\'t be here if you leave and come back. Worth screenshotting or copying it now.</p>'
      : "";
    document.getElementById("tailor-modal-body").innerHTML = saveWarning + renderMarkdown(result.data.result);
    document.getElementById("tailor-modal-timestamp").textContent = result.data.saveFailed ? "Not saved" : formatTailorTimestamp(new Date().toISOString());
    document.getElementById("tailor-modal-regen").dataset.appId = appId;

    loadApps(); // refresh so the row button switches to "View tailored CV advice"
  }

  document.getElementById("tailor-modal-close").addEventListener("click", closeTailorModal);
  document.getElementById("tailor-modal-backdrop").addEventListener("click", (e) => {
    if (e.target.id === "tailor-modal-backdrop") closeTailorModal();
  });
  document.getElementById("tailor-modal-regen").addEventListener("click", function () {
    requestReferenceCV(this.dataset.appId, null);
  });
</script>

<script>
  document.querySelectorAll('.nav-caret').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var menu = btn.nextElementSibling;
      document.querySelectorAll('.nav-dropdown-menu.open').forEach(function (m) {
        if (m !== menu) m.classList.remove('open');
      });
      menu.classList.toggle('open');
    });
  });
  document.addEventListener('click', function () {
    document.querySelectorAll('.nav-dropdown-menu.open').forEach(function (m) {
      m.classList.remove('open');
    });
  });
</script>
</body>
