<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<title>Outreach — STK</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #F5F4EF;
    color: #16233F;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    max-width: min(960px, 94vw);
    margin: 40px auto;
    padding: 0 16px;
  }
  h1 { font-size: 28px; margin-bottom: 4px; }
  .sub { color: #5B6472; font-size: 13px; margin-bottom: 24px; }
  .top-nav {
    position: sticky;
    top: 16px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 4px;
    width: fit-content;
    background: #FFFFFF;
    border: 1px solid #D8DADD;
    border-radius: 10px;
    padding: 5px;
    margin: 0 auto 28px;
    box-shadow: 0 2px 12px rgba(15,23,42,0.08);
  }
  .top-nav .brand {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 700;
    font-size: 14px;
    color: #8C6A28;
    padding: 8px 14px 8px 12px;
    margin-right: 4px;
    border-right: 1px solid #D8DADD;
    text-decoration: none;
    letter-spacing: 0.03em;
  }
  .top-nav a.nav-link {
    padding: 8px 16px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    color: #5B6472;
    text-decoration: none;
  }
  .top-nav a.nav-link.active {
    background: #B08D57;
    color: #16233F;
  }
  .top-nav a.nav-link.soon {
    color: #8A8F99;
  }
  .nav-dropdown { position: relative; display: flex; align-items: center; }
  .nav-caret {
    background: none;
    border: none;
    color: #8A8F99;
    cursor: pointer;
    font-size: 10px;
    padding: 8px 10px 8px 2px;
    margin-right: -6px;
  }
  .nav-dropdown-menu {
    display: none;
    position: absolute;
    top: 120%;
    left: 0;
    background: #FFFFFF;
    border: 1px solid #D8DADD;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(15,23,42,0.1);
    padding: 6px;
    min-width: 190px;
    z-index: 200;
  }
  .nav-dropdown-menu.open { display: block; }
  .nav-dropdown-menu a {
    display: block;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    color: #16233F;
    text-decoration: none;
  }
  .nav-dropdown-menu a:hover { background: #F6F6F3; }
  .nav-dropdown-menu a.active { color: #8C6A28; font-weight: 600; }
  .sub-nav {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .sub-nav a {
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 20px;
    text-decoration: none;
    color: #5B6472;
    background: #FFFFFF;
    border: 1px solid #D8DADD;
  }
  .sub-nav a.active {
    background: #B08D57;
    color: #16233F;
    border-color: #B08D57;
  }
  form {
    background: #FFFFFF;
    border: 1px solid #D8DADD;
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }
  .field-row {
    display: flex;
    gap: 10px;
  }
  .field-row > * { flex: 1; }
  input, select, textarea {
    background: #F6F6F3;
    border: 1px solid #D8DADD;
    border-radius: 6px;
    padding: 8px 10px;
    color: #16233F;
    font-size: 14px;
    font-family: inherit;
    width: 100%;
  }
  textarea { resize: vertical; min-height: 60px; }
  label.field-label {
    font-size: 11px;
    color: #5B6472;
    margin-bottom: 3px;
    display: block;
  }
  button {
    background: #B08D57;
    border: none;
    border-radius: 6px;
    padding: 10px;
    font-weight: 600;
    cursor: pointer;
  }

  /* --- filter bar --- */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
    align-items: center;
  }
  .filters select {
    width: auto;
    font-size: 12.5px;
    padding: 6px 8px;
  }
  .tab-group { display: flex; gap: 4px; }
  .tab {
    background: none;
    border: none;
    color: #5B6472;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    font-weight: 400;
  }
  .tab.active { background: #EFEEE9; color: #16233F; }
  .status { font-size: 12px; color: #8A8F99; margin-left: auto; }

  /* --- rows --- */
  .row {
    background: #FFFFFF;
    border: 1px solid #E8E9EA;
    border-radius: 10px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .row-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 16px 10px;
    cursor: pointer;
  }
  .row .company { font-weight: 600; font-size: 15px; }
  .row .role { font-size: 12.5px; color: #5B6472; margin-top: 1px; }
  .tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 10.5px;
    color: #8C6A28;
    background: #F6EFDE;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .tag.overdue { color: #A8572A; background: #FBEEE6; }
  .deadline { font-size: 12px; color: #5B6472; text-align: right; white-space: nowrap; }

  /* --- stage track --- */
  .stage-track { display: flex; align-items: center; padding: 0 16px 14px; }
  .stage-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #C7CBCF; background: transparent;
    cursor: pointer; padding: 0; flex-shrink: 0;
  }
  .stage-dot.done { background: #B08D57; border-color: #8C6A28; }
  .stage-line { flex: 1; height: 2px; background: #D8DADD; min-width: 6px; max-width: 22px; }
  .stage-line.done { background: #B08D57; }
  .stage-label { margin-left: 10px; font-size: 11px; color: #8C6A28; white-space: nowrap; }

  .row-expanded { border-top: 1px solid #E8E9EA; padding: 12px 16px 14px; }
  .row-expanded .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 16px;
    font-size: 12.5px;
    margin-bottom: 12px;
  }
  .row-expanded .grid div span { color: #8A8F99; display: block; font-size: 10.5px; }
  .desc {
    font-size: 12.5px;
    color: #333B4D;
    line-height: 1.5;
    white-space: pre-wrap;
    margin-bottom: 12px;
    max-height: 120px;
    overflow-y: auto;
  }
  .row-actions { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .action-link {
    background: none; border: none; color: #5B6472;
    font-size: 12.5px; padding: 0; cursor: pointer;
  }
  .empty {
    padding: 48px 20px; text-align: center;
    border: 1px dashed #D8DADD; border-radius: 10px;
    color: #5B6472; font-size: 13px;
  }

  /* --- login gate --- */
  #login-gate {
    max-width: 360px;
    margin: 60px auto;
  }
  #login-gate h2 {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 22px;
    margin-bottom: 4px;
    text-align: center;
  }
  #login-gate .sub { text-align: center; margin-bottom: 20px; }
  #login-error {
    color: #B14432;
    font-size: 12.5px;
    margin-top: -2px;
    display: none;
  }
  .logout-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }
  #logout-btn {
    background: none;
    border: 1px solid #D8DADD;
    color: #5B6472;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
</head>

<div id="login-gate">
  <h2>Locked</h2>
  <div class="sub">This tracker holds personal data. <a href="index.html" style="color:#8C6A28;">Sign in from the home page</a>, then come back.</div>
</div>

<div id="app-content" style="display:none;">
<div class="logout-bar"><button id="logout-btn" type="button">Sign out</button></div>

<h1>Outreach</h1>
<div class="sub">Cold outreach & networking — synced to your database</div>

<form id="add-form">
  <div class="field-row">
    <div>
      <label class="field-label">Name</label>
      <input type="text" id="name" placeholder="e.g. Priya Sharma" required>
    </div>
    <div>
      <label class="field-label">Firm</label>
      <input type="text" id="firm" placeholder="e.g. Rothschild & Co" required>
    </div>
  </div>

  <div class="field-row">
    <div>
      <label class="field-label">Their role</label>
      <input type="text" id="role_title" placeholder="e.g. Analyst, M&A">
    </div>
    <div>
      <label class="field-label">Channel</label>
      <select id="channel">
        <option value="">— Select —</option>
        <option>LinkedIn</option>
        <option>Email</option>
        <option>Event / In-person</option>
        <option>Alumni network</option>
        <option>Other</option>
      </select>
    </div>
  </div>

  <div class="field-row">
    <div>
      <label class="field-label">Date contacted</label>
      <input type="date" id="date_contacted">
    </div>
    <div>
      <label class="field-label">Next follow-up</label>
      <input type="date" id="next_follow_up">
    </div>
  </div>

  <div>
    <label class="field-label">Profile / contact link</label>
    <input type="text" id="link" placeholder="LinkedIn URL, email address, etc.">
  </div>

  <div>
    <label class="field-label">Notes</label>
    <textarea id="notes" placeholder="What you said, what they replied, anything to remember for the next touch"></textarea>
  </div>

  <button type="submit" id="submit-btn">Add contact</button>
  <button type="button" id="cancel-edit-btn" style="display:none; background:#D8DADD; color:#16233F;">Cancel edit</button>
</form>

<div class="filters">
  <div class="tab-group" id="status-tabs">
    <button class="tab active" data-filter="active">Active</button>
    <button class="tab" data-filter="closed">Closed</button>
    <button class="tab" data-filter="all">All</button>
  </div>
  <select id="due-filter">
    <option value="">All contacts</option>
    <option value="due">Follow-up due</option>
  </select>
  <span class="status" id="status-text">Loading...</span>
</div>

<div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://dnlrpybpbivtpnipkwpo.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRubHJweWJwYml2dHBuaXBrd3BvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MzgyODMsImV4cCI6MjEwMTQxNDI4M30.vVhwpSS5lMwTArRN-CHae5z3WMIbb5V-2mkUgHhiROw";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // The stages a contact moves through, in order.
  const STAGES = [
    "Researching", "Contacted", "Followed Up", "Replied",
    "Call Booked", "Call Completed", "Referral / Intro"
  ];

  const CLOSED_LABELS = { referral: "Referral / Intro", no_response: "No Response", dead_end: "Dead End" };

  const form = document.getElementById("add-form");
  const list = document.getElementById("list");
  const statusText = document.getElementById("status-text");
  const statusTabs = document.getElementById("status-tabs");
  const dueFilter = document.getElementById("due-filter");

  let allContacts = [];
  let allApps = [];
  let currentTab = "active";
  let editingId = null;

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  // Loads applications that reference contacts, so each contact can show
  // what it actually converted into — the outreach → application feedback loop.
  async function loadLinkedApps() {
    const { data, error } = await sb
      .from("applications")
      .select("id, company, role, source_contact_id")
      .not("source_contact_id", "is", null);

    if (error) {
      console.error(error);
      return;
    }
    allApps = data;
  }

  function appsFromContact(contactId) {
    return allApps.filter(a => String(a.source_contact_id) === String(contactId));
  }

  async function loadContacts() {
    statusText.textContent = "Loading...";
    await loadLinkedApps();
    const { data, error } = await sb
      .from("contacts")
      .select("*")
      .order("next_follow_up", { ascending: true });

    if (error) {
      statusText.textContent = "Error — check console (F12)";
      console.error(error);
      return;
    }

    allContacts = data;
    statusText.textContent = data.length + " total";
    renderList();
  }

  function renderList() {
    let filtered = allContacts;

    if (currentTab === "active") filtered = filtered.filter(c => !c.closed);
    if (currentTab === "closed") filtered = filtered.filter(c => c.closed);

    if (dueFilter.value === "due") {
      filtered = filtered.filter(c => !c.closed && c.next_follow_up && c.next_follow_up <= todayStr());
    }

    list.innerHTML = "";

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">Nothing here yet — add a contact above or adjust your filters.</div>';
      return;
    }

    filtered.forEach(c => list.appendChild(buildRow(c)));
  }

  function buildRow(c) {
    const row = document.createElement("div");
    row.className = "row";

    const top = document.createElement("div");
    top.className = "row-top";

    const linkedApps = appsFromContact(c.id);
    const followUpOverdue = !c.closed && c.next_follow_up && c.next_follow_up <= todayStr();
    const tagsHtml = [c.role_title, c.channel]
      .filter(Boolean)
      .map(t => `<span class="tag">${t}</span>`)
      .join("") + (linkedApps.length ? `<span class="tag" style="color:#1F7A4C;background:#E4F3EA;">→ ${linkedApps.length} application${linkedApps.length > 1 ? "s" : ""}</span>` : "");

    top.innerHTML = `
      <div>
        <div class="company">${c.name}</div>
        <div class="role">${c.firm}</div>
        ${tagsHtml ? `<div class="tags">${tagsHtml}</div>` : ""}
      </div>
      <div class="deadline">
        ${c.closed
          ? ""
          : c.next_follow_up
            ? `<span class="${followUpOverdue ? "tag overdue" : ""}" style="${followUpOverdue ? "" : "background:none;padding:0;"}">Follow up ${c.next_follow_up}</span>`
            : "No follow-up set"}
      </div>
    `;
    top.addEventListener("click", () => {
      const exp = row.querySelector(".row-expanded");
      exp.style.display = exp.style.display === "none" ? "block" : "none";
    });
    row.appendChild(top);

    if (!c.closed) {
      row.appendChild(buildStageTrack(c));
    } else {
      const badge = document.createElement("div");
      const positive = c.closed === "referral";
      badge.style.cssText = `padding:0 16px 14px; font-size:11px; color:${positive ? "#1F7A4C" : "#5B6472"};`;
      badge.textContent = CLOSED_LABELS[c.closed] || c.closed;
      row.appendChild(badge);
    }

    const linkedAppsHtml = linkedApps.length
      ? `<div class="desc" style="color:#1F7A4C">Converted to: ${linkedApps.map(a => `${a.company} — ${a.role}`).join("; ")}</div>`
      : `<div class="desc" style="color:#8A8F99">Not yet linked to an application — add one in the tracker and select this contact under "Sourced via."</div>`;

    const expanded = document.createElement("div");
    expanded.className = "row-expanded";
    expanded.style.display = "none";
    expanded.innerHTML = `
      <div class="grid">
        <div><span>Date contacted</span>${c.date_contacted || "—"}</div>
        <div><span>Next follow-up</span>${c.next_follow_up || "—"}</div>
      </div>
      ${c.notes ? `<div class="desc">${c.notes}</div>` : ""}
      ${linkedAppsHtml}
      <div class="row-actions">
        ${c.link ? `<a class="action-link" href="${c.link}" target="_blank" rel="noopener">Open profile</a>` : ""}
        <button class="action-link" data-edit="${c.id}">Edit</button>
        ${!c.closed
          ? `<button class="action-link" style="color:#1F7A4C" data-referral="${c.id}">Mark referral/intro</button>
             <button class="action-link" style="color:#B14432" data-noresponse="${c.id}">No response</button>
             <button class="action-link" style="color:#B14432" data-deadend="${c.id}">Dead end</button>`
          : `<button class="action-link" data-reopen="${c.id}">Reopen</button>`}
        <button class="action-link" style="color:#8A3A2E;margin-left:auto" data-delete="${c.id}">Delete</button>
      </div>
    `;
    row.appendChild(expanded);

    return row;
  }

  function buildStageTrack(c) {
    let currentIndex = STAGES.indexOf(c.stage);
    if (currentIndex === -1) currentIndex = 0;

    const track = document.createElement("div");
    track.className = "stage-track";

    STAGES.forEach((stageName, i) => {
      if (i > 0) {
        const line = document.createElement("div");
        line.className = "stage-line" + (i <= currentIndex ? " done" : "");
        track.appendChild(line);
      }
      const dot = document.createElement("button");
      dot.type = "button";
      dot.className = "stage-dot" + (i <= currentIndex ? " done" : "");
      dot.title = stageName;
      dot.addEventListener("click", (e) => {
        e.stopPropagation();
        updateField(c.id, { stage: stageName });
      });
      track.appendChild(dot);
    });

    const label = document.createElement("span");
    label.className = "stage-label";
    label.textContent = STAGES[currentIndex];
    track.appendChild(label);

    return track;
  }

  async function updateField(id, fields) {
    const { error } = await sb.from("contacts").update(fields).eq("id", id);
    if (error) {
      alert("Couldn't update — check console (F12)");
      console.error(error);
      return;
    }
    loadContacts();
  }

  function normalizeLink(value) {
    if (!value) return null;
    const trimmed = value.trim();
    if (!trimmed) return null;
    if (trimmed.includes("@") && !trimmed.startsWith("mailto:")) return "mailto:" + trimmed;
    return /^https?:\/\//i.test(trimmed) ? trimmed : "https://" + trimmed;
  }

  function startEdit(c) {
    editingId = c.id;
    document.getElementById("name").value = c.name || "";
    document.getElementById("firm").value = c.firm || "";
    document.getElementById("role_title").value = c.role_title || "";
    document.getElementById("channel").value = c.channel || "";
    document.getElementById("date_contacted").value = c.date_contacted || "";
    document.getElementById("next_follow_up").value = c.next_follow_up || "";
    document.getElementById("link").value = c.link || "";
    document.getElementById("notes").value = c.notes || "";

    document.getElementById("submit-btn").textContent = "Save changes";
    document.getElementById("cancel-edit-btn").style.display = "inline-block";
    form.scrollIntoView({ behavior: "smooth" });
  }

  function cancelEdit() {
    editingId = null;
    form.reset();
    document.getElementById("submit-btn").textContent = "Add contact";
    document.getElementById("cancel-edit-btn").style.display = "none";
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    const payload = {
      name: document.getElementById("name").value,
      firm: document.getElementById("firm").value,
      role_title: document.getElementById("role_title").value || null,
      channel: document.getElementById("channel").value || null,
      date_contacted: document.getElementById("date_contacted").value || null,
      next_follow_up: document.getElementById("next_follow_up").value || null,
      link: normalizeLink(document.getElementById("link").value),
      notes: document.getElementById("notes").value || null,
    };

    let error;
    if (editingId) {
      ({ error } = await sb.from("contacts").update(payload).eq("id", editingId));
    } else {
      payload.stage = "Researching";
      ({ error } = await sb.from("contacts").insert([payload]));
    }

    if (error) {
      alert("Couldn't save — check console (F12)");
      console.error(error);
      return;
    }

    cancelEdit();
    loadContacts();
  });

  list.addEventListener("click", async function (e) {
    const t = e.target;
    if (t.dataset.delete) {
      const { error } = await sb.from("contacts").delete().eq("id", t.dataset.delete);
      if (error) { console.error(error); return; }
      loadContacts();
    }
    if (t.dataset.edit) {
      const c = allContacts.find(a => String(a.id) === t.dataset.edit);
      if (c) startEdit(c);
    }
    if (t.dataset.referral) updateField(t.dataset.referral, { closed: "referral" });
    if (t.dataset.noresponse) updateField(t.dataset.noresponse, { closed: "no_response" });
    if (t.dataset.deadend) updateField(t.dataset.deadend, { closed: "dead_end" });
    if (t.dataset.reopen) updateField(t.dataset.reopen, { closed: null });
  });

  document.getElementById("cancel-edit-btn").addEventListener("click", cancelEdit);

  statusTabs.addEventListener("click", (e) => {
    if (!e.target.dataset.filter) return;
    currentTab = e.target.dataset.filter;
    [...statusTabs.children].forEach(b => b.classList.toggle("active", b === e.target));
    renderList();
  });

  dueFilter.addEventListener("change", renderList);

  // --- Auth gate ---
  sb.auth.onAuthStateChange((event, session) => {
    document.getElementById("login-gate").style.display = session ? "none" : "block";
    document.getElementById("app-content").style.display = session ? "block" : "none";
    if (session) {
      loadContacts();
    }
  });

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await sb.auth.signOut();
    window.location.href = "index.html";
  });
</script>

<script>
  document.querySelectorAll('.nav-caret').forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      var menu = btn.nextElementSibling;
      document.querySelectorAll('.nav-dropdown-menu.open').forEach(function (m) {
        if (m !== menu) m.classList.remove('open');
      });
      menu.classList.toggle('open');
    });
  });
  document.addEventListener('click', function () {
    document.querySelectorAll('.nav-dropdown-menu.open').forEach(function (m) {
      m.classList.remove('open');
    });
  });
</script>
</body>
</html>
