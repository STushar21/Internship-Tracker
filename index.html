<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pipeline — Internship Tracker</title>
<style>
  body {
    background: #14171C;
    color: #ECE9E2;
    font-family: system-ui, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 16px;
  }
  h1 { font-size: 28px; margin-bottom: 4px; }
  .sub { color: #8B92A0; font-size: 13px; margin-bottom: 24px; }
  form {
    background: #1B1F26;
    border: 1px solid #2A2F38;
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }
  input {
    background: #14171C;
    border: 1px solid #2A2F38;
    border-radius: 6px;
    padding: 8px 10px;
    color: #ECE9E2;
    font-size: 14px;
  }
  button {
    background: #B08D57;
    border: none;
    border-radius: 6px;
    padding: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  .row {
    background: #1B1F26;
    border: 1px solid #2A2F38;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 8px;
  }
  .row-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .row .company { font-weight: 600; }
  .row .role { font-size: 12px; color: #8B92A0; }
  .row .deadline { font-size: 12px; color: #B08D57; }
  .row button.delete {
    background: none;
    color: #B85C4A;
    font-size: 12px;
    padding: 4px 8px;
  }
  .status { font-size: 12px; color: #5C6270; margin-bottom: 12px; }

  /* --- stage track --- */
  .stage-track {
    display: flex;
    align-items: center;
  }
  .stage-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid #3A4048;
    background: transparent;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  .stage-dot.done {
    background: #B08D57;
    border-color: #B08D57;
  }
  .stage-line {
    flex: 1;
    height: 2px;
    background: #2A2F38;
    min-width: 6px;
  }
  .stage-line.done { background: #B08D57; }
  .stage-label {
    margin-left: 10px;
    font-size: 11px;
    color: #B08D57;
    white-space: nowrap;
  }
</style>
</head>
<body>

<h1>Pipeline</h1>
<div class="sub">IB internship tracker — synced to your database</div>
<div class="status" id="status">Loading...</div>

<form id="add-form">
  <input type="text" id="company" placeholder="Company (e.g. Goldman Sachs)" required>
  <input type="text" id="role" placeholder="Role (e.g. Spring Week)" required>
  <input type="date" id="deadline">
  <button type="submit">Add to pipeline</button>
</form>

<div id="list"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://dnlrpybpbivtpnipkwpo.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRubHJweWJwYml2dHBuaXBrd3BvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MzgyODMsImV4cCI6MjEwMTQxNDI4M30.vVhwpSS5lMwTArRN-CHae5z3WMIbb5V-2mkUgHhiROw";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // The stages an application moves through, in order.
  // These MUST exactly match what gets saved in the "stage" column.
  const STAGES = [
    "Researching",
    "Applied",
    "Online Tests",
    "Video Interview",
    "Assessment Centre",
    "Final Round",
    "Offer"
  ];

  const form = document.getElementById("add-form");
  const list = document.getElementById("list");
  const status = document.getElementById("status");

  async function loadApps() {
    status.textContent = "Loading...";
    const { data, error } = await sb
      .from("applications")
      .select("*")
      .order("deadline", { ascending: true });

    if (error) {
      status.textContent = "Error loading data — check console (F12)";
      console.error(error);
      return;
    }

    status.textContent = data.length + " application(s) synced";
    render(data);
  }

  // Builds the row of dots/lines showing progress through STAGES
  function buildStageTrack(app) {
    // Work out which stage index this application is currently at.
    // Defaults to 0 (Researching) if the stored value doesn't match anything.
    let currentIndex = STAGES.indexOf(app.stage);
    if (currentIndex === -1) currentIndex = 0;

    const track = document.createElement("div");
    track.className = "stage-track";

    STAGES.forEach((stageName, i) => {
      if (i > 0) {
        const line = document.createElement("div");
        line.className = "stage-line" + (i <= currentIndex ? " done" : "");
        track.appendChild(line);
      }

      const dot = document.createElement("button");
      dot.type = "button";
      dot.className = "stage-dot" + (i <= currentIndex ? " done" : "");
      dot.title = stageName;
      dot.addEventListener("click", () => updateStage(app.id, stageName));
      track.appendChild(dot);
    });

    const label = document.createElement("span");
    label.className = "stage-label";
    label.textContent = STAGES[currentIndex];
    track.appendChild(label);

    return track;
  }

  // Saves a new stage value for one application
  async function updateStage(id, stageName) {
    const { error } = await sb
      .from("applications")
      .update({ stage: stageName })
      .eq("id", id);

    if (error) {
      alert("Couldn't update stage — check console (F12)");
      console.error(error);
      return;
    }
    loadApps();
  }

  function render(apps) {
    list.innerHTML = "";
    apps.forEach((app) => {
      const row = document.createElement("div");
      row.className = "row";

      const top = document.createElement("div");
      top.className = "row-top";
      top.innerHTML = `
        <div>
          <div class="company">${app.company}</div>
          <div class="role">${app.role}</div>
        </div>
        <div>
          <div class="deadline">${app.deadline || "No deadline"}</div>
          <button class="delete" data-id="${app.id}">Delete</button>
        </div>
      `;

      row.appendChild(top);
      row.appendChild(buildStageTrack(app));
      list.appendChild(row);
    });
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    const company = document.getElementById("company").value;
    const role = document.getElementById("role").value;
    const deadline = document.getElementById("deadline").value;

    const { error } = await sb
      .from("applications")
      .insert([{ company, role, deadline: deadline || null, stage: "Researching" }]);

    if (error) {
      alert("Couldn't save — check console (F12)");
      console.error(error);
      return;
    }

    form.reset();
    loadApps();
  });

  list.addEventListener("click", async function (e) {
    if (e.target.classList.contains("delete")) {
      const id = e.target.getAttribute("data-id");
      const { error } = await sb.from("applications").delete().eq("id", id);
      if (error) {
        alert("Couldn't delete — check console (F12)");
        console.error(error);
        return;
      }
      loadApps();
    }
  });

  loadApps();
</script>

</body>
</html>
