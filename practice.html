<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assessment Practice — Pipeline</title>
<style>
  body {
    background: #14171C;
    color: #ECE9E2;
    font-family: system-ui, sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 16px 80px;
  }
  a { color: #B08D57; }
  h1 { font-size: 28px; margin-bottom: 4px; }
  .sub { color: #8B92A0; font-size: 13px; margin-bottom: 24px; }
  .back-link { font-size: 12.5px; margin-bottom: 18px; display: inline-block; }

  /* --- category picker --- */
  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  /* Buttons don't inherit page text color by default in most browsers —
     explicitly setting color here is what fixes the black-on-dark bug. */
  .cat-card {
    background: #1B1F26;
    border: 1px solid #2A2F38;
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    text-align: left;
    color: #ECE9E2;
    font-family: inherit;
  }
  .cat-card:hover { border-color: #B08D57; }
  .cat-title { font-weight: 600; font-size: 14.5px; margin-bottom: 4px; color: #ECE9E2; }
  .cat-desc { font-size: 11.5px; color: #8B92A0; line-height: 1.4; }
  .cat-count { font-size: 10.5px; color: #B08D57; margin-top: 8px; }
  .cat-due { font-size: 10.5px; color: #4F9D69; margin-top: 2px; }

  /* --- quiz --- */
  #quiz-view { display: none; }
  .progress { font-size: 11.5px; color: #8B92A0; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .difficulty {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .difficulty.easy { background: #1E3324; color: #4F9D69; }
  .difficulty.medium { background: #332B18; color: #D9A441; }
  .difficulty.hard { background: #33201C; color: #C97A64; }
  .card {
    background: #1B1F26;
    border: 1px solid #2A2F38;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
    color: #ECE9E2;
  }
  .passage {
    font-size: 13px;
    color: #C7CAD1;
    line-height: 1.6;
    background: #14171C;
    border: 1px solid #23272F;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 14px;
    white-space: pre-wrap;
  }
  .question { font-size: 15px; font-weight: 600; margin-bottom: 14px; line-height: 1.4; color: #ECE9E2; }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    background: #14171C;
    border: 1px solid #2A2F38;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    color: #ECE9E2;
    font-size: 13.5px;
    cursor: pointer;
    font-family: inherit;
  }
  .option:hover { border-color: #B08D57; }
  .option.correct { border-color: #4F9D69; background: #1E3324; }
  .option.incorrect { border-color: #B85C4A; background: #33201C; }
  .option:disabled { cursor: default; }
  .explanation {
    font-size: 12.5px;
    color: #8B92A0;
    line-height: 1.5;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #23272F;
    display: none;
  }
  .quiz-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-top: 14px;
  }
  button.primary {
    background: #B08D57;
    color: #14171C;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13.5px;
    font-family: inherit;
  }
  button.ghost {
    background: none;
    border: none;
    color: #8B92A0;
    font-size: 12.5px;
    cursor: pointer;
    font-family: inherit;
  }

  /* --- results --- */
  #results-view { display: none; text-align: center; }
  .score { font-size: 40px; font-weight: 700; color: #B08D57; margin: 10px 0; }
</style>
</head>
<body>

<a class="back-link" href="index.html">← Back to Pipeline</a>
<h1>Assessment Practice</h1>
<div class="sub">Practice the test types firms actually use in early-stage screening</div>

<div id="category-view">
  <div class="cat-grid" id="cat-grid"></div>
</div>

<div id="quiz-view">
  <button class="ghost" id="exit-quiz" style="margin-bottom:10px;">← Choose a different category</button>
  <div class="progress" id="progress"></div>
  <div class="card" id="question-card"></div>
</div>

<div id="results-view">
  <div class="sub">Session complete</div>
  <div class="score" id="score-display"></div>
  <div id="score-note" style="color:#8B92A0; font-size:13px; margin-bottom:20px;"></div>
  <button class="primary" id="retry-btn">Another pass</button>
  <button class="ghost" id="back-to-cats-btn" style="margin-left:12px;">Choose another category</button>
</div>

<script>
  // ---------------------------------------------------------------
  // QUESTION BANKS
  // Each question can optionally include a "passage" shown above it.
  // "difficulty" is just a label shown to you — it doesn't affect scoring.

  const CATEGORIES = {

        },
        {
          difficulty: "easy",
          passage: "Following a wave of consolidation, the top five accountancy firms now audit a larger proportion of listed companies than at any point in the past two decades. Regulators have expressed concern that this concentration increases systemic risk should any one of these firms face a major failure.",
          question: "Regulators believe the current level of concentration among audit firms poses no risk.",
          options: ["True", "False", "Cannot Say"],
          correct: 1,
          explanation: "The passage says regulators have expressed concern about increased systemic risk — the opposite of believing there's no risk."
        },
        {
          difficulty: "medium",
          passage: "Following a wave of consolidation, the top five accountancy firms now audit a larger proportion of listed companies than at any point in the past two decades. Regulators have expressed concern that this concentration increases systemic risk should any one of these firms face a major failure.",
          question: "The concentration of audit work among the top five firms is at its highest level in at least twenty years.",
          options: ["True", "False", "Cannot Say"],
          correct: 0,
          explanation: "Directly supported: 'a larger proportion... than at any point in the past two decades.'"

      ]

    logical: {
      title: "Logical Reasoning",

        {

            "The company has used Supplier A for over five years",
            "Price is the only factor customers care about"
          ],
          correct: 0,
          explanation: "The argument only holds if being cheaper is actually a net benefit — which assumes quality/reliability aren't compromised."
        },
        {
          difficulty: "medium",
          passage: "Argument: \"Interest rates have risen for three consecutive quarters. Therefore, interest rates will rise again next quarter.\"",
          question: "Is this conclusion strong or weak, based on logic alone?",
          options: [
            "Strong — past trends always continue",
            "Weak — a past trend continuing is not logically guaranteed, and no reasoning is given for why it would continue",
            "Strong — three data points is statistically sufficient",
            "Weak — because interest rates never rise four times in a row"
          ],
          correct: 1,
          explanation: "A trend continuing isn't logically necessary just because it happened before — the argument needs a causal reason, which isn't given."
        },
        {
          difficulty: "easy",
          passage: "All the analysts on the team hit their deadline this month. Priya is an analyst on the team.",
          question: "Which conclusion follows with certainty?",
          options: [
            "Priya is the best performer on the team",
            "Priya hit her deadline this month",
            "Priya will hit her deadline next month too",
            "Priya works harder than other teams"
          ],
          correct: 1,
          explanation: "This is a direct, valid deduction: if all analysts hit their deadline, and Priya is one of them, then Priya hit her deadline."
        },
        {
          difficulty: "medium",
          passage: "Argument: \"Our top-performing fund manager wakes up at 5am every day. Therefore, waking up early causes strong investment performance.\"",
          question: "What is the main flaw in this argument?",
          options: [
            "It correctly identifies a proven cause-and-effect relationship",
            "It mistakes a single correlation for a proven cause, based on only one example",
            "It uses too much data to reach its conclusion",
            "There is no flaw — the logic is sound"
          ],
          correct: 1,
          explanation: "One person's habits and success happening together doesn't establish that one causes the other — a classic correlation-vs-causation flaw, especially weak with a sample of one."
        },
        {
          difficulty: "medium",
          passage: "Statement: \"The firm should expand into the Asian market because several competitors have already done so successfully.\"",
          question: "Which assumption is this argument most reliant on?",
          options: [
            "Asian markets are larger than European markets",
            "The firm has the same capabilities and resources as those competitors",
            "The competitors are publicly listed",
            "No firm has ever failed expanding into Asia"
          ],
          correct: 1,
          explanation: "The argument only makes sense if the firm is similarly positioned to succeed as its competitors were."
        },
        {
          difficulty: "medium",
          passage: "Since the merger was announced, the share price has risen 10%. Therefore, the market believes the merger will be successful.",
          question: "What is the main assumption underlying this conclusion?",
          options: [
            "The share price increase was caused by the merger announcement, rather than other factors",
            "The company has never had a share price increase before",
            "All mergers cause price increases",
            "The market is always correct"
          ],
          correct: 0,
          explanation: "The conclusion only follows if the merger announcement is actually what drove the price move, rather than some unrelated event happening at the same time."
        },
        {
          difficulty: "hard",
          passage: "All senior bankers work more than 70 hours per week. Raj works more than 70 hours per week.",
          question: "Which conclusion follows with certainty?",
          options: [
            "Raj is a senior banker",
            "Raj may or may not be a senior banker",
            "Raj is not a senior banker",
            "Raj wants to become a senior banker"
          ],
          correct: 1,
          explanation: "This is a classic 'affirming the consequent' trap: knowing all senior bankers work long hours doesn't mean everyone who works long hours is a senior banker."
        },
        {
          difficulty: "medium",
          passage: "Since introducing flexible working, employee satisfaction scores have improved. Therefore the firm should expand flexible working to all departments.",
          question: "What would most weaken this argument, if true?",
          options: [
            "Departments that introduced flexible working also received unrelated pay rises at the same time",
            "Flexible working is popular in other industries too",
            "Some employees enjoy working from home",
            "The firm has grown in headcount"
          ],
          correct: 0,
          explanation: "If a second, unrelated change (a pay rise) happened alongside flexible working, it becomes unclear which change actually drove the satisfaction improvement — undermining the causal claim."
        },
        {
          difficulty: "hard",
          passage: "No junior analysts have signing authority. Some employees with signing authority are Managing Directors.",
          question: "Which conclusion is logically valid?",
          options: [
            "Some junior analysts are Managing Directors",
            "All Managing Directors have signing authority",
            "No employees with signing authority are junior analysts",
            "No Managing Directors have signing authority"
          ],
          correct: 2,
          explanation: "This is the logical contrapositive of the first statement: if no junior analysts have signing authority, then equally, no one with signing authority is a junior analyst."
        },
        {
          difficulty: "medium",
          passage: "Two out of three interns who joined without a targeted internship went on to receive full-time offers, while only one of five interns who completed a targeted internship received an offer. Therefore, targeted internships reduce your chances of getting a full-time offer.",
          question: "What is the primary weakness in this argument?",
          options: [
            "The sample sizes are very small, so the comparison may not be reliable",
            "Interns always receive offers regardless of internship type",
            "The argument correctly proves causation",
            "There is no weakness in this argument"
          ],
          correct: 0,
          explanation: "Comparing 3 people to 5 people is far too small a sample to draw a reliable conclusion about cause and effect — the difference could easily be chance."
        }
      ]
    }
  };

  // Assign a stable ID to every question: category key + its position, e.g. "numerical-3"
  Object.entries(CATEGORIES).forEach(([key, cat]) => {
    cat.questions.forEach((q, i) => { q.id = `${key}-${i}`; });
  });

  // ---------------------------------------------------------------
  // SPACED REPETITION (Anki-style "leitner box" system)
  // Every question has a "box" (0 = just missed / brand new, higher =
  // known better) and a "due" date. Get it right → box goes up and it's
  // due further in the future. Get it wrong → box resets to 0 and it's
  // due again today, so it comes back soon. Data lives in this browser
  // only (localStorage), same as your first Phase 1 tracker version.
  // ---------------------------------------------------------------
  const SRS_KEY = "assessment_srs_v1";
  const INTERVAL_DAYS = [0, 1, 3, 7, 14]; // days until next review, indexed by box
  const SESSION_SIZE = 8;

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function addDays(dateStr, days) {
    const d = new Date(dateStr);
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);
  }

  function loadSrs() {
    try {
      return JSON.parse(localStorage.getItem(SRS_KEY)) || {};
    } catch (e) {
      return {};
    }
  }

  function saveSrs(data) {
    localStorage.setItem(SRS_KEY, JSON.stringify(data));
  }

  // A question is "due" if we've never seen it, or its stored due date has arrived
  function isDue(srs, id) {
    const entry = srs[id];
    if (!entry) return true;
    return entry.due <= todayStr();
  }

  function recordAnswer(id, wasCorrect) {
    const srs = loadSrs();
    const entry = srs[id] || { box: 0, due: todayStr() };

    if (wasCorrect) {
      entry.box = Math.min(entry.box + 1, INTERVAL_DAYS.length - 1);
    } else {
      entry.box = 0;
    }
    entry.due = addDays(todayStr(), INTERVAL_DAYS[entry.box]);

    srs[id] = entry;
    saveSrs(srs);
  }

  function shuffle(array) {
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // Returns a shuffled copy of a question with its options reordered
  // and the "correct" index recalculated to match the new order.
  function shuffleQuestionOptions(q) {
    const correctText = q.options[q.correct];
    const shuffledOptions = shuffle(q.options);
    return {
      ...q,
      options: shuffledOptions,
      correct: shuffledOptions.indexOf(correctText),
    };
  }

  // Builds today's session for a category: due questions first (shuffled),
  // topped up with not-yet-due questions if there aren't enough due ones.
  function buildSession(categoryKey) {
    const srs = loadSrs();
    const all = CATEGORIES[categoryKey].questions;

    const due = shuffle(all.filter(q => isDue(srs, q.id)));
    const notDue = shuffle(all.filter(q => !isDue(srs, q.id)));

    const session = due.concat(notDue).slice(0, SESSION_SIZE);
    return session.map(shuffleQuestionOptions);
  }

  function dueCount(categoryKey) {
    const srs = loadSrs();
    return CATEGORIES[categoryKey].questions.filter(q => isDue(srs, q.id)).length;
  }

  // ---------------------------------------------------------------
  // APP LOGIC
  // ---------------------------------------------------------------
  const catView = document.getElementById("category-view");
  const catGrid = document.getElementById("cat-grid");
  const quizView = document.getElementById("quiz-view");
  const resultsView = document.getElementById("results-view");
  const questionCard = document.getElementById("question-card");
  const progressEl = document.getElementById("progress");

  let activeCategoryKey = null;
  let sessionQuestions = [];
  let currentIndex = 0;
  let score = 0;

  function renderCategoryGrid() {
    catGrid.innerHTML = "";
    Object.entries(CATEGORIES).forEach(([key, cat]) => {
      const due = dueCount(key);
      const card = document.createElement("button");
      card.className = "cat-card";
      card.innerHTML = `
        <div class="cat-title">${cat.title}</div>
        <div class="cat-desc">${cat.desc}</div>
        <div class="cat-count">${cat.questions.length} questions in bank</div>
        <div class="cat-due">${due} due for review</div>
      `;
      card.addEventListener("click", () => startQuiz(key));
      catGrid.appendChild(card);
    });
  }

  function startQuiz(key) {
    activeCategoryKey = key;
    sessionQuestions = buildSession(key);
    currentIndex = 0;
    score = 0;
    catView.style.display = "none";
    resultsView.style.display = "none";
    quizView.style.display = "block";
    renderQuestion();
  }

  function renderQuestion() {
    const cat = CATEGORIES[activeCategoryKey];
    const q = sessionQuestions[currentIndex];

    progressEl.innerHTML = `
      <span>${cat.title} — Question ${currentIndex + 1} of ${sessionQuestions.length}</span>
      <span class="difficulty ${q.difficulty}">${q.difficulty}</span>
    `;

    questionCard.innerHTML = `
      ${q.passage ? `<div class="passage">${q.passage}</div>` : ""}
      <div class="question">${q.question}</div>
      <div id="options-wrap"></div>
      <div class="explanation" id="explanation">${q.explanation}</div>
      <div class="quiz-actions">
        <button class="primary" id="next-btn" style="display:none;">
          ${currentIndex + 1 === sessionQuestions.length ? "See results" : "Next question"}
        </button>
      </div>
    `;

    const optionsWrap = document.getElementById("options-wrap");
    q.options.forEach((optionText, i) => {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.textContent = optionText;
      btn.addEventListener("click", () => selectAnswer(i));
      optionsWrap.appendChild(btn);
    });
  }

  function selectAnswer(selectedIndex) {
    const q = sessionQuestions[currentIndex];
    const options = document.querySelectorAll("#options-wrap .option");
    const wasCorrect = selectedIndex === q.correct;

    options.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.correct) btn.classList.add("correct");
      else if (i === selectedIndex) btn.classList.add("incorrect");
    });

    if (wasCorrect) score++;
    recordAnswer(q.id, wasCorrect);

    document.getElementById("explanation").style.display = "block";
    document.getElementById("next-btn").style.display = "inline-block";
  }

  document.addEventListener("click", (e) => {
    if (e.target.id === "next-btn") {
      currentIndex++;
      if (currentIndex < sessionQuestions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }
  });

  function showResults() {
    quizView.style.display = "none";
    resultsView.style.display = "block";
    document.getElementById("score-display").textContent = `${score} / ${sessionQuestions.length}`;

    const pct = Math.round((score / sessionQuestions.length) * 100);
    let note;
    if (pct >= 80) note = "Strong result. The ones you missed will resurface soon — everything else is now scheduled further out.";
    else if (pct >= 50) note = "Decent foundation. Another pass will focus mostly on what you got wrong just now.";
    else note = "Good to find out now rather than in the real test. The questions you missed will come straight back up next time.";
    document.getElementById("score-note").textContent = note;
  }

  document.getElementById("exit-quiz").addEventListener("click", () => {
    quizView.style.display = "none";
    catView.style.display = "block";
    renderCategoryGrid();
  });

  document.getElementById("retry-btn").addEventListener("click", () => startQuiz(activeCategoryKey));

  document.getElementById("back-to-cats-btn").addEventListener("click", () => {
    resultsView.style.display = "none";
    catView.style.display = "block";
    renderCategoryGrid();
  });

  renderCategoryGrid();
</script>

</body>
