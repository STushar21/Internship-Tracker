          explanation: "This is stated directly in the second sentence: some experienced people are not partners, meaning experience alone doesn't make someone a partner."
        },
        {
          difficulty: "medium",
          passage: "Statement: \"The merger will likely fail because a similar merger between two other companies in the same sector failed last year.\"",
          question: "Which assumption does this argument rely on?",
          options: [
            "The circumstances of the two mergers are comparable enough for the earlier outcome to be relevant",
            "Mergers in this sector never succeed",
            "The companies are direct competitors",
            "The previous merger failed due to price"
          ],
          correct: 0,
          explanation: "The argument only holds if the two situations are similar enough that one failure is actually informative about the other."
        }
      ]
    }
  };

  // Assign a stable ID to every question: category key + its position, e.g. "numerical-3"
  Object.entries(CATEGORIES).forEach(([key, cat]) => {
    cat.questions.forEach((q, i) => { q.id = `${key}-${i}`; });
  });

  // ---------------------------------------------------------------
  // SPACED REPETITION (Anki-style "leitner box" system)
  // Every question has a "box" (0 = just missed / brand new, higher =
  // known better) and a "due" date. Get it right → box goes up and it's
  // due further in the future. Get it wrong → box resets to 0 and it's
  // due again today, so it comes back soon. Data lives in this browser
  // only (localStorage), same as your first Phase 1 tracker version.
  // ---------------------------------------------------------------
  const SRS_KEY = "assessment_srs_v1";
  const INTERVAL_DAYS = [0, 1, 3, 7, 14]; // days until next review, indexed by box
  const SESSION_SIZE = 5;

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function addDays(dateStr, days) {
    const d = new Date(dateStr);
    d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10);
  }

  function loadSrs() {
    try {
      return JSON.parse(localStorage.getItem(SRS_KEY)) || {};
    } catch (e) {
      return {};
    }
  }

  function saveSrs(data) {
    localStorage.setItem(SRS_KEY, JSON.stringify(data));
  }

  // A question is "due" if we've never seen it, or its stored due date has arrived
  function isDue(srs, id) {
    const entry = srs[id];
    if (!entry) return true;
    return entry.due <= todayStr();
  }

  function recordAnswer(id, wasCorrect) {
    const srs = loadSrs();
    const entry = srs[id] || { box: 0, due: todayStr() };

    if (wasCorrect) {
      entry.box = Math.min(entry.box + 1, INTERVAL_DAYS.length - 1);
    } else {
      entry.box = 0;
    }
    entry.due = addDays(todayStr(), INTERVAL_DAYS[entry.box]);

    srs[id] = entry;
    saveSrs(srs);
  }

  function shuffle(array) {
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  // Returns a shuffled copy of a question with its options reordered
  // and the "correct" index recalculated to match the new order.
  function shuffleQuestionOptions(q) {
    const correctText = q.options[q.correct];
    const shuffledOptions = shuffle(q.options);
    return {
      ...q,
      options: shuffledOptions,
      correct: shuffledOptions.indexOf(correctText),
    };
  }

  // Builds today's session for a category: due questions first (shuffled),
  // topped up with not-yet-due questions if there aren't enough due ones.
  function buildSession(categoryKey) {
    const srs = loadSrs();
    const all = CATEGORIES[categoryKey].questions;

    const due = shuffle(all.filter(q => isDue(srs, q.id)));
    const notDue = shuffle(all.filter(q => !isDue(srs, q.id)));

    const session = due.concat(notDue).slice(0, SESSION_SIZE);
    return session.map(shuffleQuestionOptions);
  }

  function dueCount(categoryKey) {
    const srs = loadSrs();
    return CATEGORIES[categoryKey].questions.filter(q => isDue(srs, q.id)).length;
  }

  // ---------------------------------------------------------------
  // APP LOGIC
  // ---------------------------------------------------------------
  const catView = document.getElementById("category-view");
  const catGrid = document.getElementById("cat-grid");
  const quizView = document.getElementById("quiz-view");
  const resultsView = document.getElementById("results-view");
  const questionCard = document.getElementById("question-card");
  const progressEl = document.getElementById("progress");

  let activeCategoryKey = null;
  let sessionQuestions = [];
  let currentIndex = 0;
  let score = 0;

  function renderCategoryGrid() {
    catGrid.innerHTML = "";
    Object.entries(CATEGORIES).forEach(([key, cat]) => {
      const due = dueCount(key);
      const card = document.createElement("button");
      card.className = "cat-card";
      card.innerHTML = `
        <div class="cat-title">${cat.title}</div>
        <div class="cat-desc">${cat.desc}</div>
        <div class="cat-count">${cat.questions.length} questions in bank</div>
        <div class="cat-due">${due} due for review</div>
      `;
      card.addEventListener("click", () => startQuiz(key));
      catGrid.appendChild(card);
    });
  }

  function startQuiz(key) {
    activeCategoryKey = key;
    sessionQuestions = buildSession(key);
    currentIndex = 0;
    score = 0;
    catView.style.display = "none";
    resultsView.style.display = "none";
    quizView.style.display = "block";
    renderQuestion();
  }

  function renderQuestion() {
    const cat = CATEGORIES[activeCategoryKey];
    const q = sessionQuestions[currentIndex];

    progressEl.innerHTML = `
      <span>${cat.title} — Question ${currentIndex + 1} of ${sessionQuestions.length}</span>
      <span class="difficulty ${q.difficulty}">${q.difficulty}</span>
    `;

    questionCard.innerHTML = `
      ${q.passage ? `<div class="passage">${q.passage}</div>` : ""}
      <div class="question">${q.question}</div>
      <div id="options-wrap"></div>
      <div class="explanation" id="explanation">${q.explanation}</div>
      <div class="quiz-actions">
        <button class="primary" id="next-btn" style="display:none;">
          ${currentIndex + 1 === sessionQuestions.length ? "See results" : "Next question"}
        </button>
      </div>
    `;

    const optionsWrap = document.getElementById("options-wrap");
    q.options.forEach((optionText, i) => {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.textContent = optionText;
      btn.addEventListener("click", () => selectAnswer(i));
      optionsWrap.appendChild(btn);
    });
  }

  function selectAnswer(selectedIndex) {
    const q = sessionQuestions[currentIndex];
    const options = document.querySelectorAll("#options-wrap .option");
    const wasCorrect = selectedIndex === q.correct;

    options.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.correct) btn.classList.add("correct");
      else if (i === selectedIndex) btn.classList.add("incorrect");
    });

    if (wasCorrect) score++;
    recordAnswer(q.id, wasCorrect);

    document.getElementById("explanation").style.display = "block";
    document.getElementById("next-btn").style.display = "inline-block";
  }

  document.addEventListener("click", (e) => {
    if (e.target.id === "next-btn") {
      currentIndex++;
      if (currentIndex < sessionQuestions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }
  });

  function showResults() {
    quizView.style.display = "none";
    resultsView.style.display = "block";
    document.getElementById("score-display").textContent = `${score} / ${sessionQuestions.length}`;

    const pct = Math.round((score / sessionQuestions.length) * 100);
    let note;
    if (pct >= 80) note = "Strong result. The ones you missed will resurface soon — everything else is now scheduled further out.";
    else if (pct >= 50) note = "Decent foundation. Another pass will focus mostly on what you got wrong just now.";
    else note = "Good to find out now rather than in the real test. The questions you missed will come straight back up next time.";
    document.getElementById("score-note").textContent = note;
  }

  document.getElementById("exit-quiz").addEventListener("click", () => {
    quizView.style.display = "none";
    catView.style.display = "block";
    renderCategoryGrid();
  });

  document.getElementById("retry-btn").addEventListener("click", () => startQuiz(activeCategoryKey));

  document.getElementById("back-to-cats-btn").addEventListener("click", () => {
    resultsView.style.display = "none";
    catView.style.display = "block";
    renderCategoryGrid();
  });

  renderCategoryGrid();
</script>

</body>
</html>
