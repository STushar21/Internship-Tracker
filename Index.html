<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pipeline — Internship Tracker</title>
<style>
  body {
    background: #14171C;
    color: #ECE9E2;
    font-family: system-ui, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 0 16px;
  }
  h1 { font-size: 28px; margin-bottom: 4px; }
  .sub { color: #8B92A0; font-size: 13px; margin-bottom: 24px; }
  form {
    background: #1B1F26;
    border: 1px solid #2A2F38;
    border-radius: 8px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }
  input {
    background: #14171C;
    border: 1px solid #2A2F38;
    border-radius: 6px;
    padding: 8px 10px;
    color: #ECE9E2;
    font-size: 14px;
  }
  button {
    background: #B08D57;
    border: none;
    border-radius: 6px;
    padding: 10px;
    font-weight: 600;
    cursor: pointer;
  }
  .row {
    background: #1B1F26;
    border: 1px solid #2A2F38;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .row .company { font-weight: 600; }
  .row .role { font-size: 12px; color: #8B92A0; }
  .row .deadline { font-size: 12px; color: #B08D57; }
  .row button.delete {
    background: none;
    color: #B85C4A;
    font-size: 12px;
    padding: 4px 8px;
  }
</style>
</head>
<body>

<h1>Pipeline</h1>
<div class="sub">IB internship tracker — data saved in this browser</div>

<form id="add-form">
  <input type="text" id="company" placeholder="Company (e.g. Goldman Sachs)" required>
  <input type="text" id="role" placeholder="Role (e.g. Spring Week)" required>
  <input type="date" id="deadline">
  <button type="submit">Add to pipeline</button>
</form>

<div id="list"></div>

<script>
  // Load existing applications from the browser's storage, or start empty
  let apps = JSON.parse(localStorage.getItem("apps")) || [];

  // Grab references to the HTML elements we'll need
  const form = document.getElementById("add-form");
  const list = document.getElementById("list");

  // Draws the current list of applications onto the page
  function render() {
    list.innerHTML = "";
    apps.forEach((app, index) => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `
        <div>
          <div class="company">${app.company}</div>
          <div class="role">${app.role}</div>
        </div>
        <div>
          <div class="deadline">${app.deadline || "No deadline"}</div>
          <button class="delete" data-index="${index}">Delete</button>
        </div>
      `;
      list.appendChild(row);
    });
  }

  // Saves the current list to the browser so it survives a page reload
  function save() {
    localStorage.setItem("apps", JSON.stringify(apps));
  }

  // Runs when the form is submitted
  form.addEventListener("submit", function (e) {
    e.preventDefault(); // stops the page from reloading
    const company = document.getElementById("company").value;
    const role = document.getElementById("role").value;
    const deadline = document.getElementById("deadline").value;

    apps.push({ company, role, deadline });
    save();
    render();
    form.reset();
  });

  // Handles clicks on any "Delete" button (event delegation)
  list.addEventListener("click", function (e) {
    if (e.target.classList.contains("delete")) {
      const index = e.target.getAttribute("data-index");
      apps.splice(index, 1);
      save();
      render();
    }
  });

  render(); // draw the list on first load
</script>

</body>
</html>
